[project]
name = "platformtrust-ai-service"
version = "0.1.0"
description = "PlatformTrust AI service (FastAPI) - separate model-neutral process for AI capabilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.34",
    "pydantic~=2.10",
    "pydantic-settings~=2.7",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "httpx~=0.28",
    "ruff~=0.8",
    "mypy~=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platformtrust_ai_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
