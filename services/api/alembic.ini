# Alembic configuration for the AI PlatformTrust API.
#
# The database URL is intentionally left blank here: it is resolved at runtime
# from the DATABASE_URL environment variable in migrations/env.py so that no
# credentials are ever committed to the repository.

[alembic]
script_location = migrations
prepend_sys_path = .
# Use a timestamp-friendly, sortable naming scheme for new revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
