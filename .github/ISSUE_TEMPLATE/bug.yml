name: Bug report
description: Report a defect in PlatformTrust
title: '[Bug]: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for us to reproduce it.

        Do NOT paste secrets, credentials, tokens, connector payloads, PII, or real
        customer data in this issue. Redact logs before pasting. If this is a security
        vulnerability, do NOT use this template — see the private reporting option in
        the issue chooser and in SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ordered steps that reliably reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where the bug occurred.
      placeholder: |
        - Affected app/service (web / api / worker / ai-service):
        - Environment (local / staging / production):
        - Browser / OS (if UI):
        - Version / commit SHA:
    validations:
      required: true

  - type: dropdown
    id: tenant-impact
    attributes:
      label: Tenant impact
      description: How does this affect tenants? Describe impact only; do NOT include tenant-identifying data.
      options:
        - Single tenant only
        - Multiple tenants
        - All tenants
        - Potential cross-tenant data exposure (security)
        - Unknown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: >-
        Paste any relevant error output or stack traces. Remove all secrets,
        tokens, and PII first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have removed all secrets, tokens, and PII from this report.
          required: true
