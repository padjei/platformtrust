name: Bug report
description: Report a defect in AI PlatformTrust
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do NOT include secrets, tokens, or
        personally identifiable information in this report.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ordered steps that reliably reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where the bug occurred.
      placeholder: |
        - Environment: local / staging / production
        - Browser / client:
        - App version / commit SHA:
    validations:
      required: true

  - type: dropdown
    id: tenant-impact
    attributes:
      label: Tenant impact
      description: How does this affect tenants?
      options:
        - Single tenant only
        - Multiple tenants
        - All tenants
        - Potential cross-tenant data exposure (security)
        - Unknown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant logs or screenshots. Redact all sensitive data.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have removed all secrets, tokens, and PII from this report.
          required: true
