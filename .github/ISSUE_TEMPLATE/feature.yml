name: Feature request
description: Propose a new feature or enhancement for PlatformTrust
title: '[Feature]: '
labels: ['type:feature']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Fill out the sections below so we can scope,
        prioritize, and align it with the Constitution and the Definition of Done.
        Do not include secrets, credentials, PII, or real customer data.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the feature.
      placeholder: What should be built, in one or two sentences?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      description: Describe the problem and the value from the user's perspective.
      placeholder: As a <role>, I want <capability> so that <benefit>.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How should this work? Note any UX, API, or data considerations.
      placeholder: Describe the intended behavior and approach.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Testable conditions that define "done".
      placeholder: |
        - [ ] Given ... when ... then ...
        - [ ] ...
    validations:
      required: true

  - type: checkboxes
    id: affected-areas
    attributes:
      label: Affected areas
      description: Select all parts of the platform this feature touches.
      options:
        - label: Frontend (apps/web)
        - label: Backend (apps/api, apps/worker)
        - label: AI service (apps/ai-service)
        - label: Infrastructure (infrastructure/, CI, deployment)
        - label: Documentation (docs/)
        - label: Tests

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this feature explicitly does NOT include.
      placeholder: List anything intentionally excluded to avoid scope creep.
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Related ADRs / issues
      description: Link any relevant architecture decision records, designs, or issues.
      placeholder: e.g. docs/adr/ADR-0002-initial-application-technology-stack.md, PT-001
    validations:
      required: false
